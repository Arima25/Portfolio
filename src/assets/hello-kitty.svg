<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="50" cy="45" r="30" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>

  <!-- Ears -->
  <circle cx="30" cy="20" r="12" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>
  <circle cx="70" cy="20" r="12" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>

  <!-- Ear inner -->
  <circle cx="30" cy="20" r="8" fill="#FFB6C1"/>
  <circle cx="70" cy="20" r="8" fill="#FFB6C1"/>

  <!-- Eyes -->
  <circle cx="42" cy="40" r="3" fill="#000"/>
  <circle cx="58" cy="40" r="3" fill="#000"/>

  <!-- Nose -->
  <circle cx="50" cy="48" r="2.5" fill="#FFB6C1"/>

  <!-- Mouth -->
  <path d="M 50 48 Q 48 52 45 51" stroke="#FFB6C1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 50 48 Q 52 52 55 51" stroke="#FFB6C1" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="50" cy="80" rx="20" ry="25" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>

  <!-- Bow on head -->
  <g>
    <!-- Left bow -->
    <ellipse cx="35" cy="15" rx="6" ry="8" fill="#FF69B4"/>
    <!-- Right bow -->
    <ellipse cx="65" cy="15" rx="6" ry="8" fill="#FF69B4"/>
    <!-- Bow center -->
    <circle cx="50" cy="15" r="3.5" fill="#FF1493"/>
  </g>

  <!-- Arms -->
  <ellipse cx="32" cy="75" rx="6" ry="12" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>
  <ellipse cx="68" cy="75" rx="6" ry="12" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>

  <!-- Feet -->
  <ellipse cx="42" cy="105" rx="7" ry="8" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>
  <ellipse cx="58" cy="105" rx="7" ry="8" fill="#FFF8DC" stroke="#FFB6C1" stroke-width="1"/>
</svg>
